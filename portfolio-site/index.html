<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGV-MON Demo</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a33;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, #070b16, #0b1020);
        color: var(--text);
      }
      .wrap {
        max-width: 860px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid #22305b;
        border-radius: 14px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 30px;
      }
      p {
        line-height: 1.6;
        color: var(--muted);
        margin: 10px 0;
      }
      .buttons {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .btn {
        display: inline-block;
        text-decoration: none;
        background: var(--accent);
        color: white;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn.secondary {
        background: transparent;
        border: 1px solid #3b4c82;
      }
      .meta {
        margin-top: 16px;
        font-size: 14px;
        color: var(--muted);
      }
      code {
        background: #1b2647;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>UGV-MON Demo</h1>
        <p>
          Real-time monitoring dashboard for VIC↔OCS UDP communication. This
          page is hosted on GitHub Pages for portfolio sharing.
        </p>
        <p>
          Click the live demo button to open the deployed Dash app on Render.
        </p>
        <div class="buttons">
          <a
            id="demoLink"
            class="btn"
            href="https://ugv-mon-demo.onrender.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open Live Demo
          </a>
          <a
            class="btn secondary"
            href="https://github.com/mandu5/RealTimeDashboard"
            target="_blank"
            rel="noopener noreferrer"
          >
            View GitHub Repository
          </a>
        </div>
        <p class="meta">
          Live demo endpoint:
          <code>https://ugv-mon-demo.onrender.com/</code>
        </p>
      </section>
    </main>
  </body>
</html>
